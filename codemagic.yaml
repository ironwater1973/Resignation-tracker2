workflows:
  ios-release:
    name: iOS Resignation Tracker Release & App Store Upload
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Resignation Tracker
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.resignation.tracker
      vars:
        BUNDLE_ID: "com.resignation.tracker"
        XCODE_SCHEME: "WorkVibeTracker"
        XCODE_WORKSPACE: "iOS/WorkVibeTracker.xcworkspace"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up keychain and code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --export-type app_store
      - name: Build iOS IPA
        script: |
          xcode-project generate-export-options-plist --profile-type app_store || true
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --export-options-plist "iOS/ExportOptions.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - ironwater1973@yahoo.com.sg
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
